<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesident Evil — FX Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d0f; color: #d9dde2; font: 12px/1.35 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #app { position: fixed; inset: 0; }
      #panel {
        position: fixed; top: 10px; left: 10px; width: 290px; max-height: calc(100% - 20px); overflow: auto;
        background: rgba(18, 20, 24, 0.86); border: 1px solid #2a2f36; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px);
      }
      #panel h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: 0.03em; }
      #panel h1 span { color: #e0b43a; }
      #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #8a929c; margin: 10px 0 5px; }
      .grid { display: flex; flex-wrap: wrap; gap: 4px; }
      button { background: #22272d; color: #d9dde2; border: 1px solid #333a42; border-radius: 5px; padding: 4px 7px; font: inherit; cursor: pointer; }
      button:hover { background: #2b3139; border-color: #4a525c; }
      button.on { background: #b8472e; border-color: #b8472e; color: #fff; }
      button kbd { color: #8a929c; font-size: 10px; margin-left: 3px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .row label { min-width: 70px; color: #8a929c; }
      .row input[type='range'] { flex: 1; accent-color: #e0b43a; }
      .row output { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
      #stats { position: fixed; top: 10px; right: 10px; background: rgba(18, 20, 24, 0.86); border: 1px solid #2a2f36; border-radius: 8px; padding: 8px 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre; min-width: 190px; }
      .note { color: #8a929c; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="/src/render/fxTest.ts"></script>
  </body>
</html>
