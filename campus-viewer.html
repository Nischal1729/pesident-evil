<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PESU campus viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      #app { position: fixed; inset: 0; }
      #hud { position: fixed; left: 8px; top: 8px; z-index: 5; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #fff; background: rgba(0,0,0,0.45); padding: 6px 8px; border-radius: 4px; pointer-events: none; white-space: pre; }
      #nav { position: fixed; right: 8px; top: 8px; z-index: 6; max-width: 46vw; max-height: 92vh; image-rendering: pixelated; border: 1px solid #444; display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <canvas id="nav"></canvas>
    <script type="module" src="/src/world/campusViewer.ts"></script>
  </body>
</html>
